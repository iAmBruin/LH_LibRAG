<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凌华图书馆 - RAG智能问答系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-deep: #1a1510;
            --bg-dark: #231e17;
            --bg-panel: #2a2318;
            --bg-card: #342c21;
            --bg-input: #1e1912;
            --gold-primary: #c9a45c;
            --gold-light: #e2c87e;
            --gold-dim: #8a7040;
            --gold-glow: rgba(201, 164, 92, 0.15);
            --text-primary: #e8dcc8;
            --text-secondary: #a89880;
            --text-dim: #7a6e5e;
            --border-gold: rgba(201, 164, 92, 0.25);
            --border-subtle: rgba(201, 164, 92, 0.12);
            --accent-red: #8b4a3a;
            --accent-jade: #5a7a6a;
            --shadow-warm: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
            line-height: 1.8;
            color: var(--text-primary);
            background-color: var(--bg-deep);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ============ 顶部装饰 ============ */
        .top-ornament {
            height: 4px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--gold-dim) 15%,
                var(--gold-primary) 30%,
                var(--gold-light) 50%,
                var(--gold-primary) 70%,
                var(--gold-dim) 85%,
                transparent 100%
            );
            flex-shrink: 0;
        }

        header {
            background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-deep) 100%);
            padding: 1.5rem 2rem 1.2rem;
            text-align: center;
            position: relative;
            flex-shrink: 0;
        }

        /* 角落装饰 */
        header::before,
        header::after {
            content: '\2726';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: var(--gold-dim);
            opacity: 0.6;
        }
        header::before { left: 2rem; }
        header::after { right: 2rem; }

        .header-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        .header-deco {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--gold-dim);
            font-size: 0.75rem;
            letter-spacing: 6px;
        }

        .header-deco .line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
        }

        header h1 {
            font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
            font-size: 1.8rem;
            font-weight: 400;
            color: var(--gold-primary);
            letter-spacing: 8px;
            text-shadow: 0 0 30px rgba(201, 164, 92, 0.2);
        }

        header h1 .icon-book {
            margin-right: 12px;
            font-size: 1.4rem;
            opacity: 0.85;
        }

        .subtitle {
            font-size: 0.78rem;
            color: var(--text-dim);
            letter-spacing: 4px;
            font-weight: 400;
        }

        /* ============ 主容器 ============ */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem 1.5rem 1.5rem;
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .chat-container {
            display: flex;
            flex: 1;
            border: 1px solid var(--border-gold);
            border-radius: 4px;
            overflow: hidden;
            background-color: var(--bg-dark);
            box-shadow:
                0 0 0 1px var(--border-subtle),
                0 8px 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(201, 164, 92, 0.05);
            min-height: 0;
        }

        /* ============ 侧边栏 ============ */
        .sidebar {
            width: 270px;
            background: linear-gradient(180deg, var(--bg-panel) 0%, #251f16 100%);
            padding: 1.2rem;
            border-right: 1px solid var(--border-gold);
            display: flex;
            flex-direction: column;
            position: relative;
            flex-shrink: 0;
        }

        /* 侧边栏顶部装饰线 */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
            opacity: 0.4;
        }

        .session-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .new-session-btn, .clear-history-btn {
            flex: 1;
            background: transparent;
            color: var(--gold-primary);
            border: 1px solid var(--border-gold);
            padding: 0.5rem 0.6rem;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .new-session-btn:hover, .clear-history-btn:hover {
            background: var(--gold-glow);
            border-color: var(--gold-primary);
            box-shadow: 0 0 12px rgba(201, 164, 92, 0.1);
        }

        .new-session-btn i, .clear-history-btn i {
            margin-right: 4px;
            font-size: 0.7rem;
        }

        .history-title {
            font-size: 0.82rem;
            color: var(--gold-dim);
            margin-bottom: 0.8rem;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-gold), transparent);
        }

        .history-title i {
            font-size: 0.7rem;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            margin: 0 -0.3rem;
            padding: 0 0.3rem;
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: var(--gold-dim);
            border-radius: 2px;
        }

        .history-item {
            padding: 0.7rem 0.8rem;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 3px;
            margin-bottom: 4px;
        }

        .history-item:hover {
            background: var(--gold-glow);
            border-color: var(--border-gold);
        }

        .history-question {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
            font-size: 0.88rem;
        }

        .history-answer {
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.78rem;
            margin-top: 2px;
        }

        .session-info {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 0.8rem;
            padding: 0.5rem;
            text-align: center;
            border-top: 1px solid var(--border-subtle);
            letter-spacing: 2px;
        }

        /* ============ 主内容区 ============ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
        }

        .chat-history {
            flex: 1;
            padding: 1.5rem 2rem;
            overflow-y: auto;
            scroll-behavior: smooth;
            background:
                radial-gradient(ellipse at top, rgba(201, 164, 92, 0.03) 0%, transparent 60%),
                linear-gradient(180deg, var(--bg-dark) 0%, #201b14 100%);
        }

        .chat-history::-webkit-scrollbar {
            width: 5px;
        }
        .chat-history::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-history::-webkit-scrollbar-thumb {
            background: var(--gold-dim);
            border-radius: 3px;
        }

        /* ============ 消息样式 ============ */
        .message {
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
        }

        .message-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
        }

        .message-content {
            padding: 1rem 1.3rem;
            border-radius: 4px;
            max-width: 82%;
            word-break: break-word;
            font-size: 0.92rem;
            line-height: 1.9;
            position: relative;
        }

        .user-message {
            align-self: flex-end;
        }

        .user-message .message-label {
            text-align: right;
        }

        .user-message .message-content {
            background: linear-gradient(135deg, #3a2f20 0%, #2e2518 100%);
            color: var(--gold-light);
            border: 1px solid var(--border-gold);
            align-self: flex-end;
            border-bottom-right-radius: 1px;
        }

        .system-message {
            align-self: flex-start;
        }

        .system-message .message-content {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            align-self: flex-start;
            border-bottom-left-radius: 1px;
        }

        /* 系统消息左侧装饰条 */
        .system-message .message-content::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.5rem;
            bottom: 0.5rem;
            width: 2px;
            background: linear-gradient(180deg, transparent, var(--gold-dim), transparent);
            border-radius: 1px;
        }

        /* 欢迎消息特殊样式 */
        .welcome-message .message-content {
            background: linear-gradient(135deg, var(--bg-card) 0%, #2e2618 100%);
            border: 1px solid var(--border-gold);
            text-align: center;
            max-width: 90%;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .welcome-message .message-content::before {
            display: none;
        }

        .welcome-message .message-content::after {
            content: '\2726  \2726  \2726';
            display: block;
            text-align: center;
            color: var(--gold-dim);
            font-size: 0.6rem;
            margin-top: 0.8rem;
            letter-spacing: 4px;
            opacity: 0.6;
        }

        /* ============ 代码样式 ============ */
        .message-content pre {
            background-color: var(--bg-deep);
            padding: 1rem;
            border-radius: 3px;
            overflow-x: auto;
            border: 1px solid var(--border-subtle);
            margin: 0.5rem 0;
        }

        .message-content code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: var(--gold-light);
        }

        /* ============ 输入区域 ============ */
        .chat-input-container {
            padding: 1rem 1.5rem 1.2rem;
            border-top: 1px solid var(--border-gold);
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .source-filter {
            display: flex;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .source-filter label {
            font-size: 0.8rem;
            color: var(--gold-dim);
            letter-spacing: 2px;
        }

        .source-filter label i {
            margin-right: 4px;
            font-size: 0.7rem;
        }

        .source-filter select {
            margin-left: 0.5rem;
            padding: 0.3rem 0.8rem;
            border-radius: 3px;
            border: 1px solid var(--border-gold);
            background-color: var(--bg-input);
            color: var(--text-primary);
            font-family: 'Noto Serif SC', serif;
            font-size: 0.8rem;
        }

        .source-filter select:focus {
            outline: none;
            border-color: var(--gold-primary);
        }

        .input-group {
            display: flex;
        }

        .chat-input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-gold);
            border-right: none;
            border-radius: 3px 0 0 3px;
            font-size: 0.92rem;
            font-family: 'Noto Serif SC', serif;
            resize: none;
            height: 45px;
            max-height: 150px;
            overflow-y: auto;
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .chat-input::placeholder {
            color: var(--text-dim);
            font-style: italic;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(201, 164, 92, 0.08);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--gold-dim) 0%, var(--gold-primary) 100%);
            color: var(--bg-deep);
            border: 1px solid var(--gold-primary);
            padding: 0 1.5rem;
            border-radius: 0 3px 3px 0;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .send-btn:hover {
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-light) 100%);
            box-shadow: 0 0 20px rgba(201, 164, 92, 0.2);
        }

        .send-btn:disabled {
            background: var(--bg-card);
            color: var(--text-dim);
            border-color: var(--border-subtle);
            cursor: not-allowed;
        }

        /* ============ 打字指示器 ============ */
        .typing-indicator {
            display: inline-block;
            padding: 0.8rem 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .typing-indicator span {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--gold-dim);
            margin-right: 5px;
            animation: typing 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
            margin-right: 0;
        }

        @keyframes typing {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(-4px); opacity: 1; }
        }

        /* ============ 加载遮罩 ============ */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(26, 21, 16, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            visibility: hidden;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 2px solid var(--border-subtle);
            border-radius: 50%;
            border-top-color: var(--gold-primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============ 自定义滚动条 ============ */
        .chat-history::-webkit-scrollbar,
        .history-list::-webkit-scrollbar {
            width: 5px;
        }

        /* ============ 响应式 ============ */
        @media (max-width: 768px) {
            .chat-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-gold);
                max-height: 180px;
            }
            header h1 {
                font-size: 1.3rem;
                letter-spacing: 4px;
            }
            .chat-history {
                padding: 1rem;
            }
        }

        /* ============ 选择样式 ============ */
        ::selection {
            background: rgba(201, 164, 92, 0.3);
            color: var(--gold-light);
        }

        /* ============ 底部装饰线 ============ */
        .bottom-ornament {
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--gold-dim) 20%,
                var(--gold-primary) 50%,
                var(--gold-dim) 80%,
                transparent 100%
            );
            flex-shrink: 0;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="top-ornament"></div>

    <header>
        <div class="header-inner">
            <div class="header-deco">
                <span class="line"></span>
                <span>LINGHUA LIBRARY</span>
                <span class="line"></span>
            </div>
            <h1><i class="fas fa-book-open icon-book"></i>凌华图书馆</h1>
            <div class="subtitle">RAG 智能问答系统 &middot; 基于检索增强生成</div>
        </div>
    </header>

    <div class="container">
        <div class="chat-container">
            <div class="sidebar">
                <div class="session-controls">
                    <button class="new-session-btn" id="newSessionBtn">
                        <i class="fas fa-plus"></i> 新会话
                    </button>
                    <button class="clear-history-btn" id="clearHistoryBtn">
                        <i class="fas fa-trash-alt"></i> 清除
                    </button>
                </div>
                <div class="history-title"><i class="fas fa-scroll"></i> 历史会话</div>
                <div class="history-list" id="historyList"></div>
                <div class="session-info" id="sessionInfo"></div>
            </div>

            <div class="main-content">
                <div class="chat-history" id="chatHistory">
                    <div class="message system-message welcome-message">
                        <div class="message-content">
                            欢迎来到凌华图书馆智能问答系统<br>
                            我是您的 AI 图书管理员，可以帮您检索馆藏图书、查询借阅信息、推荐书目等
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="source-filter">
                        <label for="sourceFilter"><i class="fas fa-layer-group"></i> 图书分类：</label>
                        <select id="sourceFilter">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <textarea class="chat-input" id="chatInput" placeholder="请输入您的问题，例如：有没有关于人工智能的书籍？"
                            rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
                        <button class="send-btn" id="sendBtn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-ornament"></div>

    <script>
        let currentSessionId = null;
        let isResponseInProgress = false;
        let socket = null;

        const chatHistory = document.getElementById('chatHistory');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const sourceFilter = document.getElementById('sourceFilter');
        const historyList = document.getElementById('historyList');
        const sessionInfo = document.getElementById('sessionInfo');
        const newSessionBtn = document.getElementById('newSessionBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');

        const API_BASE_URL = '';

        document.addEventListener('DOMContentLoaded', async () => {
            await createNewSession();
            await loadSources();

            sendBtn.addEventListener('click', sendMessage);
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            newSessionBtn.addEventListener('click', createNewSession);
            clearHistoryBtn.addEventListener('click', clearHistory);
        });

        async function createNewSession() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/create_session`, {
                    method: 'POST'
                });
                if (!response.ok) throw new Error('创建会话失败');
                const data = await response.json();
                currentSessionId = data.session_id;
                sessionInfo.textContent = `会话 ${currentSessionId.slice(0, 8)}...`;
                clearChatHistory();
                await loadHistory();
            } catch (error) {
                console.error('创建会话错误:', error);
                sessionInfo.textContent = '离线模式';
            }
        }

        async function loadSources() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/sources`);
                if (!response.ok) throw new Error('获取图书分类失败');
                const data = await response.json();
                sourceFilter.innerHTML = '<option value="">全部</option>';
                data.sources.forEach(source => {
                    const option = document.createElement('option');
                    option.value = source;
                    option.textContent = source;
                    sourceFilter.appendChild(option);
                });
            } catch (error) {
                console.error('加载图书分类错误:', error);
            }
        }

        async function loadHistory() {
            if (!currentSessionId) return;
            try {
                const response = await fetch(`${API_BASE_URL}/api/history/${currentSessionId}`);
                if (!response.ok) throw new Error('获取历史记录失败');
                const data = await response.json();
                historyList.innerHTML = '';
                const sessionItem = document.createElement('div');
                sessionItem.className = 'history-item';
                sessionItem.innerHTML = `
                    <div class="history-question">会话 ${currentSessionId.slice(0, 8)}...</div>
                    <div class="history-answer">共 ${data.history.length} 轮对话</div>
                `;
                sessionItem.addEventListener('click', () => {
                    clearChatHistory();
                    data.history.forEach(item => {
                        addMessage('user', item.question);
                        addMessage('system', item.answer);
                    });
                    scrollToBottom();
                });
                historyList.appendChild(sessionItem);
            } catch (error) {
                console.error('加载历史记录错误:', error);
            }
        }

        async function clearHistory() {
            if (!currentSessionId) return;
            try {
                const response = await fetch(`${API_BASE_URL}/api/history/${currentSessionId}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('清除历史记录失败');
                historyList.innerHTML = '';
                clearChatHistory();
                chatHistory.innerHTML = `
                    <div class="message system-message welcome-message">
                        <div class="message-content">
                            历史记录已清除。欢迎继续提问，凌华图书馆随时为您服务。
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('清除历史记录错误:', error);
                alert('清除历史记录失败');
            }
        }

        function clearChatHistory() {
            chatHistory.innerHTML = `
                <div class="message system-message welcome-message">
                    <div class="message-content">
                        欢迎来到凌华图书馆智能问答系统<br>
                        我是您的 AI 图书管理员，可以帮您检索馆藏图书、查询借阅信息、推荐书目等
                    </div>
                </div>
            `;
        }

        async function sendMessage() {
            const query = chatInput.value.trim();
            const filter = sourceFilter.value;
            if (!query || isResponseInProgress) return;

            chatInput.value = '';
            chatInput.style.height = 'auto';
            addMessage('user', query);
            isResponseInProgress = true;

            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.innerHTML = '<span></span><span></span><span></span>';
            chatHistory.appendChild(typingIndicator);
            scrollToBottom();

            try {
                const response = await fetch(`${API_BASE_URL}/api/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        source_filter: filter,
                        session_id: currentSessionId
                    })
                });
                if (!response.ok) throw new Error('查询失败');
                const data = await response.json();

                if (typingIndicator.parentNode) chatHistory.removeChild(typingIndicator);

                if (data.is_streaming) {
                    const messageElement = document.createElement('div');
                    messageElement.className = 'message system-message';
                    const contentElement = document.createElement('div');
                    contentElement.className = 'message-content';
                    messageElement.appendChild(contentElement);
                    chatHistory.appendChild(messageElement);
                    await handleStreamingResponse(query, filter, contentElement);
                } else {
                    addMessage('system', data.answer);
                }
                await loadHistory();
            } catch (error) {
                console.error('发送消息错误:', error);
                if (typingIndicator.parentNode) chatHistory.removeChild(typingIndicator);
                addMessage('system', `抱歉，查询过程中发生错误: ${error.message}。请稍后重试。`);
            } finally {
                isResponseInProgress = false;
                scrollToBottom();
            }
        }

        async function handleStreamingResponse(query, filter, contentElement) {
            if (socket && socket.readyState === WebSocket.OPEN) socket.close();
            return new Promise((resolve, reject) => {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProtocol}//${window.location.host}${API_BASE_URL}/api/stream`;
                socket = new WebSocket(wsUrl);
                let accumulatedContent = '';

                socket.onopen = function() {
                    socket.send(JSON.stringify({
                        query: query,
                        source_filter: filter,
                        session_id: currentSessionId
                    }));
                };
                socket.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    switch (data.type) {
                        case 'start': break;
                        case 'token':
                            accumulatedContent += data.token;
                            contentElement.innerHTML = marked.parse(accumulatedContent);
                            scrollToBottom();
                            break;
                        case 'end':
                            socket.close();
                            resolve();
                            break;
                        case 'error':
                            contentElement.innerHTML += `<p>[错误: ${data.error}]</p>`;
                            socket.close();
                            reject(new Error(data.error));
                            break;
                    }
                };
                socket.onerror = function(error) {
                    contentElement.innerHTML += '<p>[连接错误]</p>';
                    reject(error);
                };
                socket.onclose = function() { resolve(); };
            });
        }

        function addMessage(type, content) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type === 'user' ? 'user-message' : 'system-message'}`;

            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = type === 'user' ? '读者' : '馆员';

            const contentElement = document.createElement('div');
            contentElement.className = 'message-content';
            contentElement.innerHTML = marked.parse(content);

            messageElement.appendChild(label);
            messageElement.appendChild(contentElement);
            chatHistory.appendChild(messageElement);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
</html>
